[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "file_tagger"
version = "0.1.0"
description = "A file management application with tagging capabilities"
requires-python = ">=3.13"
dependencies = [
    "PySide6==6.12.0",
    "SQLAlchemy==2.1.9",
    "alembic==1.20.1",
    "cryptography==50.0.2",
    "ollama==0.6.3",
    "docling==2.152.0",
    "sqlite-vec==0.1.9",
    "pydantic==2.14.4",
    "psutil==7.2.2",
    "platformdirs==4.14.8",
]

[project.optional-dependencies]
hardware = [
    "pywin32==312; sys_platform == 'win32'",
    "nvidia-ml-py==13.615.71; sys_platform == 'win32'",
]

[project.scripts]
file-tagger = "file_tagger.main:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-qt==4.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/file_tagger"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["file_tagger"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
packages = ["file_tagger"]
strict = true
